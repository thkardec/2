
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexão com Google Sheets</title>
</head>
<body>
    <h1>Dados da Planilha</h1>
    <div id="dados"></div>

    <script>
    const URL_API = 'https://script.google.com/macros/s/AKfycbyobkTWXRlyaSsWlxZrNkYvyINhhDk8PbUS-QwejgPxAK8oFjyYOo4gFaZKyaTBK-03Kg/exec';


        async function carregarDados() {
            try {
                const response = await fetch(URL_API);
                const dados = await response.json();

                // Exibindo os dados
                document.getElementById('dados').innerHTML = dados
                    .map(item => `<p>Nome: ${item.nome}, Idade: ${item.idade}, Cidade: ${item.cidade}</p>`)
                    .join('');
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('dados').innerHTML = 'Erro ao carregar dados.';
            }
        }

        carregarDados();
    </script>
</body>
</html>
